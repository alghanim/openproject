        help_menu: توفر قائمة المساعدة (?) <b>موارد مساعدة إضافية</b>. ستجد هنا دليل المستخدم ومقاطع فيديو إرشادية مفيدة والمزيد. <br> استمتع بعملك مع OpenProject!
        members: ادعُ <b>أعضاء</b> جددًا للانضمام إلى مشروعك.
        quick_add_button: انقر على أيقونة الزائد (+) في شريط التنقل العلوي <b>لإنشاء مشروع جديد</b> أو <b>لدعوة زملاء العمل</b>.
        sidebar_arrow: استخدم سهم الرجوع في الزاوية العلوية للعودة إلى <b>القائمة الرئيسية</b> للمشروع.
        team_planner:
          add_assignee: للبدء، أضف المُسند إليهم إلى مخطط الفريق.
          add_existing: ابحث عن حزم العمل الموجودة واسحبها إلى مخطط الفريق لإسنادها فورًا إلى أحد أعضاء الفريق وتحديد تاريخي البدء والانتهاء.
          calendar: تعرض لوحة التخطيط لأسبوع أو أسبوعين جميع حزم العمل المُسندة إلى أعضاء فريقك.
          card: اسحب حزم العمل أفقيًا لتحريكها إلى الوراء أو إلى الأمام زمنيًا، واسحب حوافها لتغيير تاريخي البدء والانتهاء، بل يمكنك سحبها عموديًا إلى صف آخر لإسنادها إلى عضو آخر.
          overview: يتيح لك مخطط الفريق إسناد المهام إلى أعضاء الفريق بصريًا والحصول على نظرة عامة حول من يعمل على ماذا.
        welcome: قم بجولة تعريفية مدتها ثلاث دقائق للتعرف على <b>أهم الميزات</b>. <br> ننصحك بإكمال الخطوات حتى النهاية. يمكنك إعادة بدء الجولة في أي وقت.
        wiki: يمكنك من خلال <b>الويكي</b> توثيق المعرفة ومشاركتها مع فريقك.
        wp:
          back_button: استخدم سهم الرجوع في الزاوية العلوية للخروج والعودة إلى قائمة حزم العمل.
          create_button: يضيف زر <b>+ إنشاء</b> حزمة عمل جديدة إلى مشروعك.
          full_view: يوفر عرض <b>تفاصيل حزمة العمل</b> جميع المعلومات ذات الصلة بحزمة عمل معينة، مثل وصفها وحالتها وأولويتها وأنشطتها وتبعياتها وتعليقاتها.
          gantt_menu: أنشئ الجداول الزمنية للمشروع وخطوطه الزمنية بسهولة باستخدام وحدة مخطط جانت.
          list: توفر هذه النظرة العامة على <b>حزم العمل</b> قائمة بجميع الأعمال في مشروعك، مثل المهام والمعالم والمراحل وغيرها. <br> يمكن إنشاء حزم العمل وتعديلها مباشرةً من هذا العرض. وللوصول إلى تفاصيل حزمة عمل معينة، ما عليك سوى النقر نقرًا مزدوجًا على صفها.
          timeline: يمكنك هنا <b>تعديل خطة مشروعك</b>، وإنشاء حزم عمل جديدة مثل المهام والمعالم والمراحل وغيرها، بالإضافة إلى <b>إضافة التبعيات</b>. يمكن لجميع أعضاء الفريق الاطلاع على أحدث خطة وتحديثها في أي وقت.
