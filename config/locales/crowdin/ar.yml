  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'اختياري: مفتاح السمة في LDAP الذي <strong>عند وجوده</strong> يُعيّن مستخدم OpenProject كمشرف. اتركه فارغاً عند الشك.'
      base_dn: |
        أدخل DN الأساسي للشجرة الفرعية في LDAP التي تريد من OpenProject البحث فيها عن المستخدمين والمجموعات.
        سيقوم OpenProject بتصفية أسماء المستخدمين المُقدَّمة داخل هذه الشجرة الفرعية فقط.
        مثال: ou=users,dc=example,dc=com
      filter_string: |
        أضف مرشح RFC4515 اختيارياً لتطبيقه على النتائج المُعادة للمستخدمين المُصفَّين في LDAP.
        يمكن استخدامه لتقييد مجموعة المستخدمين الذين يعثر عليهم OpenProject للمصادقة ومزامنة المجموعات.
      filter_string_concat: |
        سيقوم OpenProject دائماً بالتصفية لسمة تسجيل الدخول المُقدَّمة من المستخدم لتحديد السجل. إذا قدّمت مرشحاً هنا،
        فسيتم دمجه باستخدام AND. افتراضياً، يُستخدم المرشح الشامل (objectClass=*).
      generic_map: مفتاح السمة في LDAP المُعيَّن لسمة OpenProject `%{attribute}`
      host: اسم مضيف LDAP أو عنوان IP
      login_map: مفتاح السمة في LDAP المستخدم لتعريف تسجيل دخول المستخدم الفريد. عادةً ما يكون `uid` أو `samAccountName`.
