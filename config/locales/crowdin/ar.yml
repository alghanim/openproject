  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'اختياري: مفتاح السمة في LDAP الذي <strong>عند وجوده</strong> يُعيّن مستخدم OpenProject كمشرف. اتركه فارغاً عند الشك.'
      base_dn: |
        أدخل DN الأساسي للشجرة الفرعية في LDAP التي تريد من OpenProject البحث فيها عن المستخدمين والمجموعات.
        سيقوم OpenProject بتصفية أسماء المستخدمين المُقدَّمة داخل هذه الشجرة الفرعية فقط.
        مثال: ou=users,dc=example,dc=com
      filter_string: |
        أضف مرشح RFC4515 اختيارياً لتطبيقه على النتائج المُعادة للمستخدمين المُصفَّين في LDAP.
        يمكن استخدامه لتقييد مجموعة المستخدمين الذين يعثر عليهم OpenProject للمصادقة ومزامنة المجموعات.
      filter_string_concat: |
        سيقوم OpenProject دائماً بالتصفية لسمة تسجيل الدخول المُقدَّمة من المستخدم لتحديد السجل. إذا قدّمت مرشحاً هنا،
        فسيتم دمجه باستخدام AND. افتراضياً، يُستخدم المرشح الشامل (objectClass=*).
      generic_map: مفتاح السمة في LDAP المُعيَّن لسمة OpenProject `%{attribute}`
      host: اسم مضيف LDAP أو عنوان IP
      login_map: مفتاح السمة في LDAP المستخدم لتعريف تسجيل دخول المستخدم الفريد. عادةً ما يكون `uid` أو `samAccountName`.
      name: اسم تعسفي لاتصال LDAP
      onthefly_register: |
        إذا حددت هذا المربع، سيقوم OpenProject تلقائياً بإنشاء مستخدمين جدد من إدخالات LDAP الخاصة بهم
        عند مصادقتهم لأول مرة مع OpenProject.
        اترك هذا المربع غير محدد للسماح فقط للحسابات الموجودة في OpenProject بالمصادقة عبر LDAP!
      system_user_dn_html: |
        أدخل DN لمستخدم النظام المستخدم للوصول للقراءة فقط.
        <br>
        مثال: uid=openproject,ou=system,dc=example,dc=com
      system_user_password: أدخل كلمة المرور لربط مستخدم النظام
    back_to_index: انقر هنا للعودة إلى قائمة الاتصالات.
    connection_encryption: تشفير الاتصال
    encryption_details: خيارات LDAPS / STARTTLS
    ldap_auth_failed: لا يمكن مصادقة على ملقم LDAP.
    ldap_details: تفاصيل LDAP
    ldap_error: 'خطأ LDAP: %{error_message}'
    sync_failed: 'فشل المزامنة من LDAP: %{message}.'
    system_account: حساب النظام
    system_account_legend: |
      يتطلب OpenProject وصولاً للقراءة فقط عبر حساب نظام للبحث عن المستخدمين والمجموعات في شجرة LDAP الخاصة بك.
      يرجى تحديد بيانات اعتماد الربط لمستخدم النظام هذا في القسم التالي.
    technical_warning: |
      يتطلب هذا النموذج LDAP معرفة تقنية بإعداد LDAP / Active Directory الخاص بك.
      [يرجى زيارة الوثائق للاطلاع على التعليمات التفصيلية](docs_url).
    tls_mode:
      plain: لا شيء
      plain_description: يفتح اتصالاً غير مشفر بخادم LDAP. غير موصى به للإنتاج.
      section_more_info_link_html: يتعلق هذا القسم بأمان الاتصال لمصدر مصادقة LDAP هذا. لمزيد من المعلومات، تفضل بزيارة <a href="%{link}">توثيق Net::LDAP</a>.
      simple_tls: LDAPS
      simple_tls_description: استخدام LDAPS. يتطلب منفذاً منفصلاً على خادم LDAP. هذا الوضع مُهمَل في الغالب، ونوصي باستخدام STARTTLS كلما أمكن ذلك.
      start_tls: STARTTLS
      start_tls_description: يرسل أمر STARTTLS بعد الاتصال بمنفذ LDAP القياسي. موصى به للاتصالات المشفرة.
    tls_options:
      tls_certificate_description: إذا لم تكن شهادة خادم LDAP في مصادر الثقة لهذا النظام، يمكنك إضافتها يدوياً هنا. أدخل سلسلة شهادة PEM X509.
      verify_peer: التحقق من شهادة SSL
      verify_peer_description_html: يُفعّل التحقق الصارم من SSL لسلسلة ثقة الشهادة. <br> <strong>تحذير:</strong> إلغاء تحديد هذا الخيار يُعطّل التحقق من SSL لشهادة خادم LDAP. هذا يُعرّض اتصالك لهجمات الوسيط.
    user_settings: تعيين السمات
    user_settings_legend: |
      الحقول التالية تتعلق بكيفية إنشاء المستخدمين في OpenProject من إدخالات LDAP و
      بسمات LDAP المستخدمة لتحديد سمات مستخدم OpenProject (ربط السمات).
