      group_regexes_detail: حدد اختياريًا أنماطًا باستخدام التعبيرات النمطية لمطابقة أسماء المجموعات من مطالبة المجموعات. على سبيل المثال، سيؤدي إدخال نمط مثل <code>^Level1/Level2/([\w/]+)$</code> إلى استخراج المجموعة «Groupname/SubGroup» من استجابة تتضمن «Level1/Level2/GroupName/SubGroup». إذا لم يطابق أي نمط، فسيتم تجاهل المجموعة. اتركه فارغًا لمزامنة جميع المجموعات باستخدام أسمائها الكاملة.
