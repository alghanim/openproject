        sync_users_text: 'إذا فعّلت هذا الخيار، فسيتم أيضًا إنشاء المستخدمين الذين يُعثر عليهم تلقائيًا في OpenProject. وبدونه، ستُضاف الحسابات الموجودة في OpenProject فقط إلى المجموعات.

          '
      help_text_html: |
        تتيح لك هذه الوحدة إعداد مزامنة بين مجموعات LDAP ومجموعات OpenProject.
        <br/>
        افتراضيًا، يستخدم OpenProject <strong>البحث العكسي</strong>: إذ يبحث عن المستخدمين الذين تطابق سمة <em>memberOf</em> لديهم DN المجموعة.
        ويتطلب ذلك وجود سمة <em>memberOf</em> في إدخالات المستخدمين (Active Directory، أو OpenLDAP مع تراكب memberof).
        <br/>
        إذا كان خادم LDAP لديك لا يحتفظ بسمة <em>memberOf</em> في إدخالات المستخدمين (مثلًا عند استخدام <em>groupOfUniqueNames</em> مع <em>uniqueMember</em>)،
        فيمكنك تكوين <strong>البحث المباشر</strong> عبر تعيين <em>سمة أعضاء المجموعة</em> في عامل تصفية المزامنة.
        <br/>
        تتم مزامنة المجموعات كل ساعة عبر مهمة cron.
        [يُرجى الاطلاع على وثائقنا حول هذا الموضوع](docs_url).
      no_members: لا يوجد في هذه المجموعة أعضاء متزامنون بعد.
      no_results: لم يتم العثور على مجموعات متزامنة.
      plural: مجموعات LDAP المتزامنة
      singular: مجموعة LDAP متزامنة
