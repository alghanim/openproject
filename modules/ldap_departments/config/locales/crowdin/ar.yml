        title: إزالة المزامنة %{name}
      form:
        auth_source_text: حدد اتصال LDAP الذي يجب استخدامه.
        base_dn_text: 'أدخل DN الأساسي الذي تريد مزامنة وحداته التنظيمية. تصبح الوحدات التنظيمية (OU) التابعة له مباشرةً أقسامًا في المستوى الأعلى. يجب أن يكون أسفل DN الأساسي لاتصال LDAP المحدد.

          '
        guid_attribute_text: 'اختياري. سمة LDAP التي تحمل معرّفًا فريدًا ثابتًا (مثل "objectGUID" أو "entryUUID"). عند تعيينها، تبقى الأقسام محفوظة عند إعادة تسمية الوحدات التنظيمية (OU) أو نقلها. اتركها فارغة للمطابقة حسب DN.

          '
        ou_name_attribute_text: سمة LDAP المستخدمة لتسمية القسم (مثل "ou").
        sections:
          connection: اتصال LDAP
          structure: الوحدات التنظيمية
          users: المستخدمون
        structure_filter_string_text: عامل تصفية LDAP وفق RFC4515 يحدد إدخالات الوحدات التنظيمية.
        sync_users_text: 'عند التفعيل، يتم أيضًا إنشاء المستخدمين الموجودين أسفل DN الأساسي في OpenProject. وبدونه، تُسند الحسابات الموجودة فقط إلى الأقسام.

          '
        user_filter_string_text: 'عامل تصفية LDAP اختياري وفق RFC4515 يحدد إدخالات المستخدمين. اتركه فارغًا لاستخدام عامل تصفية الاتصال، أو عامل تصفية عام للأشخاص في حال عدم تعيينه.

          '
      help_text: 'تنسخ هذه الوحدة البرمجية بنية الوحدات التنظيمية (OU) في دليل LDAP إلى التسلسل الهرمي للأقسام في OpenProject. تصبح كل وحدة تنظيمية أسفل DN الأساسي المُكوَّن قسمًا، ويُسند المستخدمون إلى قسم الوحدة التنظيمية التي ينتمون إليها. تتم مزامنة الأقسام بانتظام عبر مهمة cron.

        '
