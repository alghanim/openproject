  gitlab_integration:
    issue_closed_referenced_comment: "**مشكلة مغلقة:** تم إغلاق المشكلة %{issue_number} [%{issue_title}](%{issue_url}) الخاصة بـ [%{repository}](%{repository_url}) بواسطة [%{gitlab_user}](%{gitlab_user_url}).\n"
    issue_opened_referenced_comment: "**مشكلة مفتوحة:** تم فتح المشكلة %{issue_number} [%{issue_title}](%{issue_url}) الخاصة بـ [%{repository}](%{repository_url}) بواسطة [%{gitlab_user}](%{gitlab_user_url}).\n"
    issue_reopened_referenced_comment: "**مشكلة أُعيد فتحها:** تمت إعادة فتح المشكلة %{issue_number} [%{issue_title}](%{issue_url}) الخاصة بـ [%{repository}](%{repository_url}) بواسطة [%{gitlab_user}](%{gitlab_user_url}).\n"
    merge_request_closed_comment: "**طلب دمج مغلق:** تم إغلاق طلب الدمج %{mr_number} [%{mr_title}](%{mr_url}) الخاص بـ [%{repository}](%{repository_url}) بواسطة [%{gitlab_user}](%{gitlab_user_url}).\n"
    merge_request_merged_comment: "**طلب دمج مدموج:** تم دمج طلب الدمج %{mr_number} [%{mr_title}](%{mr_url}) الخاص بـ [%{repository}](%{repository_url}) بواسطة [%{gitlab_user}](%{gitlab_user_url}).\n"
    merge_request_opened_comment: "**طلب دمج مفتوح:** تم فتح طلب الدمج %{mr_number} [%{mr_title}](%{mr_url}) الخاص بـ [%{repository}](%{repository_url}) بواسطة [%{gitlab_user}](%{gitlab_user_url}).\n"
    merge_request_reopened_comment: "**طلب دمج أُعيد فتحه:** تمت إعادة فتح طلب الدمج %{mr_number} [%{mr_title}](%{mr_url}) الخاص بـ [%{repository}](%{repository_url}) بواسطة [%{gitlab_user}](%{gitlab_user_url}).\n"
    note_commit_referenced_comment: |
      **إشارة في إيداع:** أشار [%{gitlab_user}](%{gitlab_user_url}) إلى حزمة العمل هذه في ملاحظة على الإيداع [%{commit_id}](%{commit_url}) في [%{repository}](%{repository_url}):
      %{commit_note}
    note_issue_commented_comment: |
      **تعليق في مشكلة:** علّق [%{gitlab_user}](%{gitlab_user_url}) على حزمة العمل هذه في المشكلة %{issue_number} [%{issue_title}](%{issue_url}) في [%{repository}](%{repository_url}):
      %{issue_note}
    note_issue_referenced_comment: |
      **إشارة في مشكلة:** أشار [%{gitlab_user}](%{gitlab_user_url}) إلى حزمة العمل هذه في المشكلة %{issue_number} [%{issue_title}](%{issue_url}) في [%{repository}](%{repository_url}):
      %{issue_note}
    note_mr_commented_comment: |
      **تعليق في طلب دمج:** علّق [%{gitlab_user}](%{gitlab_user_url}) على حزمة العمل هذه في طلب الدمج %{mr_number} [%{mr_title}](%{mr_url}) في [%{repository}](%{repository_url}):
      %{mr_note}
    note_mr_referenced_comment: |
      **إشارة في طلب دمج:** أشار [%{gitlab_user}](%{gitlab_user_url}) إلى حزمة العمل هذه في طلب الدمج %{mr_number} [%{mr_title}](%{mr_url}) في [%{repository}](%{repository_url}):
      %{mr_note}
    note_snippet_referenced_comment: |
      **إشارة في مقتطف:** أشار [%{gitlab_user}](%{gitlab_user_url}) إلى حزمة العمل هذه في المقتطف %{snippet_number} [%{snippet_title}](%{snippet_url}) في [%{repository}](%{repository_url}):
      %{snippet_note}
    push_multiple_commits_comment: |
      **دفع في طلب دمج:** دفع [%{gitlab_user}](%{gitlab_user_url}) عدة إيداعات [%{commit_number}](%{commit_url}) إلى [%{repository}](%{repository_url}) في %{commit_timestamp}:
      %{commit_note}
    push_single_commit_comment: |
      **دفع في طلب دمج:** دفع [%{gitlab_user}](%{gitlab_user_url}) الإيداع [%{commit_number}](%{commit_url}) إلى [%{repository}](%{repository_url}) في %{commit_timestamp}:
      %{commit_note}
    push_single_commit_comment_with_ref: |
      **دفع في %{reference}:** دفع [%{gitlab_user}](%{gitlab_user_url}) الإيداع [%{commit_number}](%{commit_url}) إلى [%{repository}](%{repository_url}) في %{commit_timestamp}:
      %{commit_note}
  label_gitlab_actor: المستخدم المنفّذ لـ GitLab
  label_gitlab_integration: التكامل مع GitLab
  label_gitlab_webhook_secret: سر Webhook
  permission_show_gitlab_content: عرض محتوى GitLab
  project_module_gitlab: GitLab
  text_gitlab_actor_info: 'مستخدم OpenProject الذي يجب استخدام مفتاح API الخاص به لمصادقة طلبات Webhook الواردة. عند تعيينه، تُرفض الطلبات المصادَق عليها ببيانات اعتماد أي مستخدم آخر. ينشر هذا المستخدم أيضًا تعليقات تلقائية على حزم العمل. يُستخدم مستخدم النظام افتراضيًا عند عدم تعيينه.

    '
  text_gitlab_webhook_secret_info: 'رمز سري مشترك مع GitLab عند تكوين Webhook. عند تعيينه، يتحقق OpenProject من الترويسة X-Gitlab-Token في كل طلب وارد، ويرفض الحمولات غير المطابقة. اتركه فارغًا لتخطي التحقق (غير مستحسن).

    '
  text_gitlab_webhook_secret_missing_warning: 'لم يتم تكوين سر Webhook. سيُقبل أي طلب إلى نقطة نهاية Webhook الخاصة بـ GitLab دون تحقق، مما قد يسمح لجهات غير مصرّح لها بتزوير الأحداث. يُوصى بشدة بتعيين سر.

    '
