  text_meeting_closing_are_you_sure: هل أنت متأكد من أنك تريد إغلاق جدول أعمال الاجتماع؟
  text_meeting_draft_banner: أنت حاليًا في وضع المسودة. لن يُرسل هذا الاجتماع أي تحديثات للتقويم أو دعوات، حتى إذا غيّرت تفاصيل الاجتماع أو أضفت مشاركين أو أزلتهم.
  text_meeting_draft_description: حضّر جدول أعمالك في وضع المسودة. لن يُرسل هذا الاجتماع أي تحديثات للتقويم أو دعوات، حتى إذا غيّرت تفاصيل الاجتماع أو أضفت مشاركين أو أزلتهم.
  text_meeting_empty_description1: ابدأ بإضافة بنود جدول الأعمال أدناه. يمكن أن يكون كل بند بسيطًا ويقتصر على عنوان فقط، ولكن يمكنك أيضًا إضافة تفاصيل أخرى مثل المدة والملاحظات.
  text_meeting_empty_description2: يمكنك أيضًا إضافة مراجع إلى حزم عمل موجودة. وعند القيام بذلك، ستظهر الملاحظات ذات الصلة تلقائيًا في علامة التبويب «الاجتماعات» الخاصة بحزمة العمل.
