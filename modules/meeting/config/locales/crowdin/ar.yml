  text_add_work_package_to_meeting_description: يمكن إضافة حزمة العمل إلى اجتماع واحد أو أكثر لمناقشتها. وتظهر هنا أيضًا أي ملاحظات تتعلق بها.
  text_add_work_package_to_meeting_form: ستُضاف حزمة العمل إلى الاجتماع المحدد أو قائمة الأعمال المتراكمة كبند في جدول الأعمال.
  text_agenda_backlog: 'قائمة الأعمال المتراكمة هذه خاصة بهذا الاجتماع لمرة واحدة. يمكنك سحب البنود إليها أو منها لإضافتها إلى جدول أعمال الاجتماع أو إزالتها منه.

    '
  text_agenda_backlog_clear_description: 'هل أنت متأكد من أنك تريد إزالة جميع البنود الموجودة حاليًا في قائمة الأعمال المتراكمة لجدول الأعمال؟ لا يمكن التراجع عن هذا الإجراء.

    '
