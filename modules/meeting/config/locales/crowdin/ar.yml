    رابط سلسلة الاجتماعات: %{series_url}
  text_meeting_open_description: يمكنك إضافة بنود جدول الأعمال والمشاركين أو إزالتهم. بمجرد أن يصبح جدول الأعمال جاهزًا، ضع عليه علامة «قيد التنفيذ» لتوثيق النتائج.
  text_meeting_open_dropdown_description: ستبقى أي نتائج موجودة، ولكن لن يتمكن المستخدمون من إضافة نتائج جديدة.
  text_meeting_series_end_early: سيؤدي إنهاء السلسلة إلى حذف أي مواعيد اجتماعات مستقبلية مفتوحة أو مجدولة
  text_meeting_series_end_early_heading: حذف المواعيد المستقبلية؟
  text_meeting_template_blank_slate: يمكنك إنشاء قالب جديد للاجتماعات لمرة واحدة
  text_meeting_template_blank_slate_heading: لا توجد قوالب لعرضها
  text_meeting_template_sharing_description: يمكن مشاركة هذا القالب مع المشاريع الفرعية أو مشاريع أخرى في هذا النظام. سيتم نسخ بنود جدول الأعمال والمرفقات فقط.
  text_notificiation_invited: 'هذا البريد الألكتروني يحتوي على مدخل (ics) للاجتماع أدناه:'
  text_onetime_meeting_template_banner: أنت تحرر حاليًا قالب اجتماع. يمكنك استخدام هذا القالب لإنشاء اجتماعات لمرة واحدة بجدول أعمال محدد مسبقًا. لن تؤثر التغييرات في الاجتماعات التي تم إنشاؤها بالفعل.
  text_onetime_meeting_template_empty_description: أضف بنود جدول الأعمال والأقسام والمرفقات هنا. سيتم تضمينها في كل اجتماع يُنشأ باستخدام هذا القالب.
  text_onetime_meeting_template_empty_heading: قالب الاجتماع هذا فارغ
  text_outcome_cannot_be_added: لم يعد بالإمكان إضافة نتيجة.
  text_outcome_not_editable_anymore: لم تعد هذه النتيجة قابلة للتحرير.
  text_series_backlog: 'قائمة الأعمال المتراكمة مشتركة بين جميع مواعيد هذه السلسلة. يمكنك سحب البنود إليها أو منها لإضافتها إلى اجتماع معين أو إزالتها منه.

    '
  text_series_backlog_clear_description: 'سيؤدي هذا إلى إزالة جميع البنود في قائمة الأعمال المتراكمة للسلسلة، وهي مشتركة بين جميع الاجتماعات في السلسلة. هل أنت متأكد من أنك تريد المتابعة؟ لا يمكن التراجع عن هذا الإجراء.

    '
  text_work_package_add_to_meeting_hint: استخدم زر «إضافة إلى اجتماع» لإضافة حزمة العمل هذه إلى اجتماع قادم.
  text_work_package_has_no_past_meeting_agenda_items: لم تُضف حزمة العمل هذه كبند في جدول أعمال أي اجتماع سابق.
  text_work_package_has_no_upcoming_meeting_agenda_items: لم تُجدول حزمة العمل هذه في جدول أعمال أي اجتماع قادم بعد.
