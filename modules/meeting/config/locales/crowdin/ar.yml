  text_meeting_in_progress_description: يمكنك تعديل جدول الأعمال وتوثيق النتائج لكل بند وتتبع حضور المشاركين. بمجرد انتهاء الاجتماع، يمكنك وضع علامة «مغلق» عليه لقفله.
  text_meeting_in_progress_dropdown_description: وثّق النتائج مثل الاحتياجات من المعلومات أو القرارات المتخذة أثناء الاجتماع.
