  text_deploy_target_type_info: 'حتى الآن نحن ندعم OpenProject نفسه فقط.

    '
  text_github_comment_user_info: 'مستخدم OpenProject الذي يجب استخدام مفتاح API الخاص به لمصادقة طلبات Webhook الواردة. عند تعيينه، تُرفض الطلبات المصادَق عليها ببيانات اعتماد أي مستخدم آخر. ينشر هذا المستخدم أيضًا تعليقات تلقائية حول حالة النشر على حزم العمل. يُستخدم مستخدم النظام افتراضيًا عند عدم تعيينه.

    '
  text_github_webhook_secret_info: 'رمز سري مشترك مع GitHub عند تكوين Webhook. عند تعيينه، يتحقق OpenProject من الترويسة X-Hub-Signature-256 في كل طلب وارد، ويرفض الحمولات غير المطابقة. اتركه فارغًا لتخطي التحقق (غير مستحسن).

    '
  text_github_webhook_secret_missing_warning: 'لم يتم تكوين سر Webhook. سيُقبل أي طلب إلى نقطة نهاية Webhook الخاصة بـ GitHub دون تحقق، مما قد يسمح لجهات غير مصرّح لها بتزوير الأحداث. يُوصى بشدة بتعيين سر.

    '
